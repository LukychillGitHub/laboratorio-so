  const totalM=ALL.length, nSeen=ALL.filter(seen).length, totM=ALL.filter(q=>ST.r[q.id]&&ST.r[q.id].last===1).length, wl=wrongList().length;
  let html=`
  <header class="stack" style="gap:8px;padding-top:12px">
    <span class="eyebrow">Sistemas Operativos · USAL · 2.º parcial</span>
    <h1>Laboratorio de SO</h1>
  </header>
  ${tabs('practicar')}
  <p class="lead">Cada pregunta te sale <b>una sola vez</b>: siempre aparecen primero las que nunca respondiste. Al final de cada ronda ves el repaso de las que erraste, con la respuesta correcta.</p>
  <div class="card">
    <div class="row" style="justify-content:space-between"><h3>Tu avance</h3><span class="mono" style="font-size:13px;color:var(--muted)">${nSeen} de ${totalM} respondidas · ${totM} bien</span></div>
    <div class="bar"><span style="width:${Math.round(nSeen*100/totalM)}%"></span></div>
    <p class="hint">Te quedan ${totalM-nSeen} preguntas nuevas, más los ejercicios generados al azar, que siempre son nuevos.</p>
  </div>
  <h2>Por tema</h2>
  <p class="hint">Lo ideal: practicá cada tema justo después de leerlo.</p>`;
  [['t','Teoría'],['p','TPs y parcial anterior'],['c','Comandos']].forEach(([g,tt])=>{
    html+=`<h3 style="margin-top:4px">${tt}</h3><ol class="toc">`;
    MODS.filter(m=>m.g===g).forEach((m,i)=>{const all=byMod(m.id), nf=fresh(all).length, d=mastered(m.id);
      html+=`<li><button class="tocb" data-p="${m.id}"><span class="tocn ${nf===0?'done':''}">${nf===0?'✓':PFX[g]+(i+1)}</span><span class="toct"><b>${esc(m.t)}</b><small>${nf} nuevas de ${all.length} · ${d} bien${GEN[m.id]?' · + ejercicios generados':''}${ST.read[m.id]?'':' · todavía no la leíste'}</small></span><span class="toca">Practicar →</span></button></li>`;});
    html+=`</ol>`;});
  html+=`<h2>Exámenes y modos especiales</h2>
  <div class="grid">
    <button class="mode" id="m-exam"><b>Examen simulado completo</b><span>20 preguntas de teoría y comandos, con nota del 1 al 10.</span></button>
    <button class="mode" id="m-examT"><b>Examen de teoría</b><span>20 preguntas de teoría, con nota.</span></button>
    <button class="mode" id="m-examC"><b>Examen de comandos</b><span>20 preguntas de comandos, con nota.</span></button>
    <button class="mode" id="m-sched"><b>Cuadros de planificación</b><span>Cada ejercicio trae procesos nuevos (FCFS, SJF, SRTF, RR, Prioridades), con el Gantt resuelto.</span></button>
    <button class="mode" id="m-mix"><b>Mezcla de todo</b><span>30 preguntas de teoría y comandos, primero las nuevas.</span></button>
    <button class="mode" id="m-mixT"><b>Mezcla de teoría</b><span>30 preguntas de teoría, primero las nuevas.</span></button>
    <button class="mode" id="m-type"><b>Escribí el comando</b><span>20 ejercicios de escribir, para fijar la sintaxis.</span></button>
    <button class="mode" id="m-perm"><b>Permisos</b><span>Octal ↔ letras, umask, chmod simbólico. Siempre datos nuevos.</span></button>
    <button class="mode" id="m-cron"><b>Cron</b><span>Leer y escribir expresiones de cron. Siempre datos nuevos.</span></button>
    <button class="mode" id="m-wrong" ${wl?'':'disabled style="opacity:.5"'}><b>Repasar mis erradas (${wl})</b><span>Solo si querés volver a las que te salieron mal.</span></button>
  </div>
  <div class="row"><button class="btn ghost small" id="reset">Borrar mi progreso de práctica</button><span class="hint" id="resetmsg"></span></div>`;
  $('v-home').innerHTML=html; bindTabs();
  $('v-home').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>practiceMod(b.dataset.p));
  ['exam','mix','mixT','sched','examT','examC','type','perm','cron'].forEach(k=>$('m-'+k).onclick=MODES[k]);
  if(wl) $('m-wrong').onclick=MODES.wrong;
  let armed=false; $('reset').onclick=()=>{ if(!armed){armed=true; $('reset').textContent='Tocá de nuevo para confirmar'; $('resetmsg').textContent='Se borran tus respuestas (no las lecciones leídas).'; return;} ST.r={}; save(); renderHome(); };
}

function openLesson(id){
  const m=MODS.find(x=>x.id===id), grp=MODS.filter(x=>x.g===m.g), gi=grp.indexOf(m), all=MODS, ai=all.indexOf(m);
  const prev=all[ai-1], nxt=all[ai+1];
  const v=$('v-lesson'); v.innerHTML='';
  const top=document.createElement('div'); top.className='row'; top.style.justifyContent='space-between';
  top.innerHTML=`<button class="back" id="lb">← Índice</button><label class="hint" for="jump">Ir a: <select id="jump">${all.map(x=>`<option value="${x.id}" ${x.id===id?'selected':''}>${GNAME[x.g]} · ${esc(x.t)}</option>`).join('')}</select></label>`;
  v.appendChild(top);
  const h=document.createElement('header'); h.className='stack'; h.style.gap='6px';
  h.innerHTML=`<span class="eyebrow">${GNAME[m.g]} · lección ${gi+1} de ${grp.length} · ${readMin(id)} min de lectura</span><h1 style="font-size:clamp(28px,4.6vw,38px)">${esc(m.t)}</h1>`; v.appendChild(h);
  const body=document.createElement('div'); body.className='lesson'; body.appendChild($('L-'+id).content.cloneNode(true)); v.appendChild(body);
  const end=document.createElement('div'); end.className='card';
  const nf=fresh(byMod(id)).length;
  end.innerHTML=`<h3>${ST.read[id]?'✓ Ya la marcaste como leída':'¿Terminaste de leer?'}</h3>
   <div class="row">${ST.read[id]?'':'<button class="btn" id="mk">Marcar como leída</button>'}
   <button class="btn ghost" id="lp">Practicar esta lección (${nf} nuevas${GEN[id]?' + generadas':''})</button></div>
   <div class="row" style="justify-content:space-between">${prev?`<button class="back" id="lpv">← ${esc(prev.t)}</button>`:'<span></span>'}${nxt?`<button class="back" id="lnx">${esc(nxt.t)} →</button>`:''}</div>`;
  v.appendChild(end);
  const markRead=()=>{ST.read[id]=1;save();};
  $('lb').onclick=()=>{ST.tab='leer';goHome();};
  $('jump').onchange=e=>openLesson(e.target.value);
  if($('mk')) $('mk').onclick=()=>{markRead(); nxt?openLesson(nxt.id):(ST.tab='leer',goHome());};
  $('lp').onclick=()=>{markRead(); practiceMod(id);};
  if($('lpv')) $('lpv').onclick=()=>openLesson(prev.id);
  if($('lnx')) $('lnx').onclick=()=>{markRead(); openLesson(nxt.id);};
  show('lesson');
}
function practiceMod(id){const m=MODS.find(x=>x.id===id); const all=byMod(id); const nf=fresh(all);
  const ng=GEN[id]?6:0;
  if(!nf.length&&!ng){ // ya respondió todas
    const v=$('v-drill'); const wr=all.filter(q=>ST.r[q.id].last===0);
    v.innerHTML=`<button class="back" id="bk">← Volver</button><div class="card result"><span class="eyebrow">${esc(m.t)}</span><h2>Ya respondiste todas las preguntas de este tema</h2><p>${all.length-wr.length} bien y ${wr.length} mal en tu último intento.</p>
     <div class="row">${wr.length?`<button class="btn" id="rw">Repasar las ${wr.length} erradas</button>`:''}<button class="btn ghost" id="ra">Hacer todo el tema otra vez</button></div></div>`;
    show('drill'); $('bk').onclick=goHome;
    if($('rw')) $('rw').onclick=()=>startSession({title:m.t+' · erradas',items:shuf(wr),mode:'learn',mod:id,again:()=>practiceMod(id)});
    $('ra').onclick=()=>startSession({title:m.t,items:shuf(all),mode:'learn',mod:id,again:()=>practiceMod(id)});
    return;}
  const mc=shuf(nf.filter(q=>q.type==='m')), wq=shuf(nf.filter(q=>q.type==='w'));
  let items=mc.concat(wq);
  if(ng){ GSEEN=new Set(); const g=gens(Array(ng).fill(id)); g.forEach((q,k)=>items.splice(Math.round((k+1)*items.length/(ng+1)),0,q)); }
  startSession({title:m.t,items,mode:'learn',mod:id,again:()=>practiceMod(id),keepGen:true});}
function goHome(){renderHome(); show('home');}

// ---------- motor de práctica ----------
let SES=null;
function startSession(o){
  if(!o.keepGen) GSEEN=new Set();
  SES={...o,queue:o.items.slice(),total:o.items.length,answered:0,correct:0,streak:0,best:0,cur:null,errors:[]};
  if(o.mode==='infinite') SES.queue=[genUnique(o.gen)];
  show('drill'); next();
}
function hud(){
  const v=SES;
  if(v.mode==='infinite') return `<div class="hud"><span>Correctas <b>${v.correct}</b> / ${v.answered}</span><span>Racha <b>${v.streak}</b></span><span>Mejor racha <b>${v.best}</b></span></div>`;
  return `<div class="hud"><span>Pregunta <b>${Math.min(v.answered+1,v.total)}</b> de ${v.total}</span><span>Correctas <b>${v.correct}</b></span><span>Racha <b>${v.streak}</b></span></div><div class="progress"><span style="width:${Math.round(v.answered*100/Math.max(1,v.total))}%"></span></div>`;
}
function next(){
  const v=SES, box=$('v-drill');
  if(v.mode==='infinite'&&!v.queue.length) v.queue.push(genUnique(v.gen));
  if(!v.queue.length) return finish();
  const q=v.queue.shift(); v.cur=q;
  box.innerHTML='';
  const top=document.createElement('div'); top.className='row'; top.style.justifyContent='space-between';
  top.innerHTML=`<button class="back" id="dq">← Salir</button><span class="eyebrow">${esc(v.title)}</span>`; box.appendChild(top);
  $('dq').onclick=()=>{ if(v.answered===0) goHome(); else finish(true); };
  const h=document.createElement('div'); h.className='stack'; h.style.gap='8px'; h.innerHTML=hud(); box.appendChild(h);
  const card=document.createElement('div'); card.className='q';
  const modT=(MODS.find(m=>m.id===q.mod)||{}).t||'';
  card.innerHTML=`<span class="tag">${esc(modT)} · ${q.type==='w'?'escribí el comando':q.term?'leé el recuadro':'multiple choice'}${q.gen?' · ejercicio generado':''}</span><div class="prompt"></div>`;
  card.querySelector('.prompt').textContent=q.q;
  if(q.term){const p=document.createElement('pre'); p.className='term'; p.textContent=q.term; card.appendChild(p);}
  const fb=document.createElement('div'); fb.hidden=true;
  const nextBtn=document.createElement('button'); nextBtn.className='btn'; nextBtn.id='nx'; nextBtn.textContent=v.queue.length||v.mode==='infinite'?'Siguiente →':'Ver resultado →'; nextBtn.hidden=true;
  const resolve=(ok,given)=>{
    v.answered++;
    if(ok){v.correct++; v.streak++; v.best=Math.max(v.best,v.streak);} else {v.streak=0; v.errors.push({q,given});}
    rec(q,ok);
    fb.hidden=false; fb.className='fb '+(ok?'good':'bad');
    let html=`<span class="v">${ok?pick(['Correcto.','Bien.','Exacto.','Eso es.']):'Incorrecto.'}</span>`;
    if(!ok&&q.type==='w') html+=`<span>Respuesta correcta: <code>${esc(q.acc[0])}</code>${q.acc.length>1?` <span class="hint">(también vale: ${q.acc.slice(1).map(a=>'<code>'+esc(a)+'</code>').join(', ')})</span>`:''}</span>`;
    if(!ok&&q.type==='m') html+=`<span>Era: <b>${esc(q.a)}</b></span>`;
    html+=`<span>${esc(q.e)}</span>`;
    fb.innerHTML=html;
    nextBtn.hidden=false; nextBtn.focus();
    h.innerHTML=hud();
  };
  if(q.type==='m'){
    const opts=document.createElement('div'); opts.className='opts';
    shuf([q.a,...q.w]).forEach((t,i)=>{const b=document.createElement('button'); b.className='opt'; b.id='o'+i;
      b.innerHTML=`<span class="k">${'ABCD'[i]}</span><span class="t"></span>`; b.querySelector('.t').textContent=t;
      b.onclick=()=>{ if(b.disabled) return; const ok=t===q.a;
        opts.querySelectorAll('.opt').forEach(x=>{x.disabled=true; if(x.querySelector('.t').textContent===q.a) x.classList.add('ok');});
        if(!ok) b.classList.add('no'); resolve(ok,t); };
      opts.appendChild(b);});
    card.appendChild(opts);
    const hint=document.createElement('p'); hint.className='hint'; hint.textContent='Atajo: teclas 1 a 4 para elegir y Enter para seguir.'; card.appendChild(hint);
  } else {
    const wrap=document.createElement('div'); wrap.className='typein';
    wrap.innerHTML=`<label class="shell" for="ti"><span>lucas@servidor:~$</span><input id="ti" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="escribí acá"></label><button class="btn" id="tc">Comprobar</button><button class="btn ghost" id="tn">No sé</button>`;
    card.appendChild(wrap);
    const inp=wrap.querySelector('#ti');
    const check=(give)=>{ if(inp.disabled) return; const ok=!give&&okTyped(inp.value,q.acc); inp.disabled=true; wrap.querySelector('#tc').disabled=true; wrap.querySelector('#tn').disabled=true; resolve(ok,give?'(no sé)':inp.value); };
    wrap.querySelector('#tc').onclick=()=>{ if(inp.value.trim()) check(false); else inp.focus(); };
    wrap.querySelector('#tn').onclick=()=>check(true);
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); e.stopPropagation(); if(inp.value.trim()) check(false);} });
    const hint=document.createElement('p'); hint.className='hint'; hint.textContent='No importan las comillas ni el orden de los flags combinados (-la = -al). Enter para comprobar.'; card.appendChild(hint);
    setTimeout(()=>inp.focus(),30);
  }
  card.appendChild(fb);
  const row=document.createElement('div'); row.className='row'; row.appendChild(nextBtn); card.appendChild(row);
  nextBtn.onclick=()=>next();
  box.appendChild(card);
}
document.addEventListener('keydown',e=>{
  if($('v-drill').hidden) return;
  if(e.target&&e.target.tagName==='INPUT'&&!e.target.disabled) return;
  const nx=$('nx'); if(e.key==='Enter'&&nx&&!nx.hidden){e.preventDefault(); nx.click(); return;}
  if(/^[1-4]$/.test(e.key)){const b=$('o'+(+e.key-1)); if(b&&!b.disabled) b.click();}
});
function finish(early){
  const v=SES, box=$('v-drill');
  const pct=v.answered?v.correct/v.answered:0;
  let headline, sub;
  if(v.mode==='exam'){ const nota=Math.max(1,Math.round(pct*100)/10); headline=nota.toFixed(1).replace('.',',');
    sub=`Nota del examen (${v.correct} de ${v.answered} correctas). ${nota>=9?'Estás listo.':nota>=7?'Bien. Mirá el repaso de abajo y hacé otro examen: te van a salir preguntas distintas.':'Volvé a leer las lecciones de los temas que fallaste y después hacé otro examen.'}`;}
  else { headline=Math.round(pct*100)+'%'; sub=`${v.correct} correctas de ${v.answered}. Mejor racha: ${v.best}.`;}
  const nfLeft=v.mod?fresh(byMod(v.mod)).length:fresh(ALL).length;
  box.innerHTML=`<div class="card result"><span class="eyebrow">${esc(v.title)}${early?' · terminado antes':''}</span><span class="big">${headline}</span><p>${sub}</p>
   <p class="hint">${v.mod?'Preguntas nuevas que quedan en este tema':'Preguntas nuevas que quedan en total'}: ${nfLeft}.</p>
   <div class="row"><button class="btn" id="fr">${v.mode==='infinite'?'Seguir':nfLeft?'Otra ronda con preguntas nuevas':'Otra ronda'}</button>${v.errors.length&&v.mode!=='infinite'?`<button class="btn ghost" id="fw">Repetir solo estas ${v.errors.length} erradas</button>`:''}<button class="btn ghost" id="fh">Volver</button></div></div>
   ${v.errors.length?`<h2>Repaso de lo que erraste</h2><div class="stack" id="rev"></div>`:''}`;
  if(v.errors.length){const rv=$('rev'); v.errors.forEach(({q,given})=>{const d=document.createElement('div'); d.className='card';
    d.innerHTML=`<span class="tag" style="font:500 11.5px/1 var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)">${esc((MODS.find(m=>m.id===q.mod)||{}).t||'')}</span><b></b>${q.term?'<pre class="term"></pre>':''}<div class="fb bad"><span>Respondiste: <span class="mono g"></span></span><span>Correcta: <b class="c"></b></span><span class="e"></span></div>`;
    d.querySelector('b').textContent=q.q; if(q.term) d.querySelector('pre').textContent=q.term;
    d.querySelector('.g').textContent=given||'—'; d.querySelector('.c').textContent=q.type==='w'?q.acc[0]:q.a; d.querySelector('.e').textContent=q.e; rv.appendChild(d);});}
  $('fh').onclick=goHome;
  $('fr').onclick=()=>v.again();
  if($('fw')) $('fw').onclick=()=>{const errs=v.errors.map(x=>x.q); startSession({title:v.title+' · erradas',items:errs,mode:'learn',mod:v.mod,again:v.again,keepGen:true});};
  window.scrollTo(0,0);
}
renderHome();
})();
</script>

<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
