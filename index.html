<template id="L-tnube">
<p>Los SO en la nube trasladan la gestión de recursos, aplicaciones y datos a datacenters distribuidos y virtualizados.</p>
<h3>Qué es un SO en la nube</h3>
<p>Una <b>plataforma de software distribuida</b> que administra <b>recursos virtualizados</b> (máquinas virtuales, contenedores, microservicios) bajo modelos <b>IaaS y PaaS</b>, sobre una red global de datacenters, de forma eficiente, escalable y segura.</p>
<h3>Tecnologías clave</h3>
<div class="tbl"><table><tbody>
<tr><td>Virtualización</td><td>Crea recursos flexibles y escalables a partir del hardware físico</td></tr>
<tr><td>Orquestación de contenedores</td><td>Gestiona miles de aplicaciones distribuidas (Docker y Kubernetes)</td></tr>
<tr><td>Microservicios</td><td>Dividen una app en componentes chicos e independientes</td></tr>
<tr><td>Serverless</td><td>Ejecutás código sin administrar servidores (AWS Lambda, Azure Functions)</td></tr>
<tr><td>Edge computing</td><td>Procesa cerca del usuario para <b>reducir la latencia</b></td></tr>
<tr><td>CDN y balanceadores</td><td>Optimizan el rendimiento global y reparten la carga</td></tr>
</tbody></table></div>
<h3>Los 4 beneficios</h3>
<ol>
<li><b>Escalabilidad y agilidad:</b> recursos elásticos, horizontales (más máquinas) o verticales (máquinas más grandes), en segundos.</li>
<li><b>Resiliencia y alta disponibilidad:</b> tolerancia a fallos, replicación entre <b>zonas de disponibilidad (AZ)</b> y balanceo; SLA superior al <b>99,99 %</b>.</li>
<li><b>Costos:</b> modelo <b>Opex</b> (pago por uso), sin grandes inversiones iniciales (Capex). El edge reduce energía y ancho de banda.</li>
<li><b>Seguridad y cumplimiento:</b> <b>ISO 27001, SOC 2, GDPR</b>.</li>
</ol>
<h3>Desafíos</h3>
<p>Consistencia de datos en entornos distribuidos y <b>multi-tenant</b> · complejidad de los microservicios y serverless (APIs RESTful) · latencia y conectividad en el edge · seguridad con miles de usuarios.</p>
<h3>Plataformas</h3>
<div class="tbl"><table><tbody>
<tr><td>AWS</td><td>Líder en IaaS/PaaS, más de 200 servicios: <b>EC2</b> (VMs), <b>S3</b> (almacenamiento), <b>Lambda</b> (serverless), <b>EKS</b> (Kubernetes). Fuerte en DevOps</td></tr>
<tr><td>Azure</td><td><b>Nubes híbridas</b> e integración con Microsoft: Virtual Machines, <b>AKS</b>, <b>Azure Functions</b></td></tr>
<tr><td>Google Cloud</td><td><b>Big data, IA y ML</b>: <b>GKE</b>, Cloud Functions</td></tr>
</tbody></table></div>
<h3>Modelos</h3>
<ul>
<li><b>Despliegue:</b> <b>pública</b> (compartida, de un proveedor; elástica y barata al inicio) · <b>privada</b> (dedicada a una organización; más control y cumplimiento) · <b>híbrida</b> (combina las dos; equilibra flexibilidad, seguridad y costo).</li>
<li><b>Servicio:</b> <b>IaaS</b> = te dan la infraestructura (VMs, almacenamiento) · <b>PaaS</b> = una plataforma para desarrollar y ejecutar apps · <b>SaaS</b> = el software terminado por web (Gmail, Office 365).</li>
</ul>
<div class="key"><h4>Ejemplo para recordar IaaS / PaaS / SaaS</h4><p>Pizza: IaaS = te dan la cocina y vos cocinás · PaaS = te dan la masa lista y vos le ponés lo que quieras · SaaS = te traen la pizza hecha.</p></div>
<h3>SO tradicional vs SO en la nube</h3>
<p>El <b>tradicional</b> gestiona directamente el hardware físico de una máquina, requiere instalación local y escala poco (Windows, Linux o macOS en una PC). El <b>de nube</b> se basa en virtualización completa, corre en datacenters remotos y se despliega <b>bajo demanda</b>, sin instalación manual (instancias EC2, VMs de Azure o GCP).</p>
<h3>Formatos de imagen: la evolución</h3>
<div class="anat"><span>ISO<small>física: CD o USB, instalación local</small></span><span>→ VHD<small>virtualización: disco virtual portable (Azure)</small></span><span>→ AMI<small>nube: imagen de AWS para lanzar muchas instancias idénticas</small></span></div>
<h3>Cloud-native</h3>
<p><b>Contenedores</b> (virtualización liviana a nivel de SO, con todas las dependencias incluidas: portables y consistentes) + <b>microservicios</b> + <b>Kubernetes</b> (orquestador: automatiza el despliegue, el escalado y la recuperación ante fallos).</p>
<p><b>SO cloud-native:</b> livianos, rápidos y seguros, con actualizaciones automáticas, aislamiento de procesos, <b>sandboxing</b> y cifrado. Ejemplos:</p>
<ul>
<li><b>ChromeOS:</b> de Google, kernel Linux, centrado en la web, con actualizaciones automáticas, sandboxing y <b>arranque verificado</b>.</li>
<li><b>FydeOS:</b> derivado de Chromium OS, con más privacidad y apps Android y Linux, sin depender de Google.</li>
<li><b>CloudReady / ChromeOS Flex:</b> creado por <b>Neverware</b> y comprado por Google, para revivir hardware viejo; ideal en educación.</li>
</ul>
<h3>Escritorios en la nube (VDI/DaaS) y educación</h3>
<p>Un SO completo corriendo en un servidor remoto y accesible desde cualquier dispositivo: <b>Azure Virtual Desktop, Citrix DaaS, Amazon WorkSpaces</b>.</p>
<p><b>Beneficios:</b> acceso universal · seguridad centralizada · mantenimiento automatizado · escalabilidad dinámica (por ejemplo, en época de exámenes). <b>Desafíos:</b> necesita una conexión estable · latencia en apps gráficas · costos recurrentes · capacitación.</p>
<div class="trap"><h4>Trampas típicas</h4><ul>
<li>La nube es <b>Opex</b> (pago por uso), no Capex.</li>
<li>El edge <b>reduce</b> la latencia.</li>
<li>AMI es de AWS; VHD es de Azure.</li>
<li>SaaS = software terminado; IaaS = infraestructura.</li>
</ul></div>
</template>

<template id="L-tactual">
<p>Para las preguntas de opinión: <b>NPU</b>, <b>tendencias globales</b> y la entrevista a <b>Tanenbaum</b>.</p>
<h3>NPU (Neural Processing Unit)</h3>
<ul>
<li>Es un procesador <b>especializado en operaciones de IA</b> (multiplicación de matrices, redes neuronales), con <b>muy bajo consumo</b>. Se mide en <b>TOPS</b> (billones de operaciones por segundo).</li>
<li><b>CPU</b> = propósito general, pocos núcleos potentes · <b>GPU</b> = paralelismo masivo y gráficos, con alto consumo · <b>NPU</b> = inferencia de IA eficiente.</li>
<li>Viene integrada en el mismo chip que la CPU y la GPU: <b>Apple Neural Engine</b> (desde 2017), <b>Intel Core Ultra</b>, <b>AMD Ryzen AI</b>, <b>Qualcomm Snapdragon X</b>.</li>
<li>Microsoft exige una NPU de <b>40 TOPS o más</b> para las PCs <b>Copilot+</b>.</li>
<li><b>Usos:</b> desenfoque de fondo en videollamadas, subtítulos en vivo, reconocimiento de voz, búsqueda en fotos, asistentes locales.</li>
<li><b>Ventajas:</b> IA <b>local</b> (privacidad, sin Internet, menos latencia) y ahorro de batería. <b>Contras:</b> todavía pocas apps la aprovechan, encarece el equipo y cada fabricante usa su propio software.</li>
<li><b>Relación con el SO:</b> hacen falta drivers y APIs (Windows ML, DirectML, Core ML) y un planificador que reparta las tareas entre CPU, GPU y NPU (<b>computación heterogénea</b>). El SO se vuelve más complejo.</li>
</ul>
<h3>Tendencias globales</h3>
<div class="tbl"><table><tbody>
<tr><td>Datos</td><td>Unos 175 ZB en 2025 (IoT, multimedia, IA, nube)</td></tr>
<tr><td>Nube</td><td>Híbrida + StaaS + serverless + cloud-native (Kubernetes)</td></tr>
<tr><td>IA</td><td>En el almacenamiento (organizar, proteger) y en el hardware (NPU)</td></tr>
<tr><td>Seguridad</td><td>Zero Trust: nunca confiar por defecto</td></tr>
<tr><td>Edge</td><td>Procesar cerca del usuario</td></tr>
<tr><td>Hardware</td><td>NVMe 2.1, PCIe 7.0, ARM (Apple M, Snapdragon X)</td></tr>
<tr><td>Sostenibilidad</td><td>Menos energía y huella de carbono en los datacenters</td></tr>
</tbody></table></div>
<h3>Tanenbaum</h3>
<ul>
<li>Estudió <b>física</b> y se pasó a la informática. Es profesor en la Vrije Universiteit de Ámsterdam y autor de <i>Sistemas Operativos Modernos</i> y <i>Redes de Computadoras</i>, libros con los que se formaron generaciones de estudiantes.</li>
<li><b>MINIX (1987):</b> AT&amp;T cambió la licencia de UNIX V7 y <b>prohibió enseñar su código</b>. Tanenbaum escribió su propio clon de UNIX y publicó <b>todo el código en el libro</b>. MINIX <b>inspiró a Linus Torvalds</b> a crear Linux.</li>
<li><b>Microkernel</b> (MINIX 3, QNX): un kernel mínimo (IPC, planificación, memoria) con los drivers como procesos de usuario. Es más confiable (un driver que falla se reinicia) pero más lento por el pasaje de mensajes. <b>Monolítico</b> (Linux): todo en modo kernel. Es más rápido, pero un bug en un driver puede tirar el sistema. <b>Híbrido</b>: Windows y macOS.</li>
<li><b>Debate Tanenbaum–Torvalds (1992)</b>, "LINUX is obsolete": Tanenbaum dijo que lo monolítico era un retroceso y que Linux era poco portable. Torvalds defendió el rendimiento y la practicidad.</li>
<li><b>"Daría la mitad del rendimiento a cambio de duplicar la confiabilidad":</b> el hardware ya es rápido; lo caro son las caídas. Ejemplo: <b>CrowdStrike (julio de 2024)</b>, un driver en modo kernel que tiró millones de PCs con Windows.</li>
<li>Los <b>SO se vuelven más complejos</b>, no más simples: cada hardware nuevo (SSD, GPU, NPU, coprocesadores criptográficos) suma drivers, planificación y seguridad.</li>
<li><b>Ideas que vuelven:</b> cuando cambian los costos del hardware (por ejemplo, el trade-off entre memoria y CPU, o la planificación de disco, que pierde sentido con SSD).</li>
<li><b>Qué enseñar:</b> principios y algoritmos duraderos, no herramientas como Word o Excel, que cambian cada pocos años.</li>
<li><b>IA en sistemas críticos:</b> postura cautelosa, porque es difícil verificar que sea correcta.</li>
</ul>

<template id="L-pparcial">
<p>Este es el 2.º parcial del año pasado (turno noche), resuelto. Son 15 preguntas: definiciones, multiple choice, una de opinión y dos cuadros de planificación de 3 puntos cada uno. Lo más probable es que mañana venga con un formato muy parecido.</p>
<h3>1. ¿Qué es un proceso? (1 pt)</h3>
<div class="key"><p>Un proceso es un <b>programa en ejecución</b>, es decir, una instancia activa de un programa. Tiene su propio espacio de memoria (código, datos y pila), un estado (nuevo, listo, ejecución, bloqueado, terminado) y recursos asignados por el SO (CPU, memoria, E/S, archivos). Se identifica con un <b>PID</b>, y el SO guarda toda su información en el <b>BCP</b>, que permite interrumpirlo y retomarlo sin perder su estado. Es la unidad básica de ejecución y planificación.</p></div>
<h3>2. El concepto de Balance (1 pt)</h3>
<p>✓ <b>Mantener ocupadas todas las partes del sistema (CPU, memoria y dispositivos de E/S) siempre que sea posible, para maximizar el trabajo por segundo.</b> La opción "exactamente la misma CPU" es una equidad exagerada; la de "apagar dispositivos" no tiene nada que ver.</p>
<h3>3. Las 4 capas de TCP/IP (1 pt)</h3>
<p><b>Aplicación</b> (HTTP, FTP, SMTP, DNS, SSH) · <b>Transporte</b> (TCP, UDP) · <b>Red</b> (IP, ICMP) · <b>Acceso a la red</b> (Ethernet, Wi-Fi, ARP). Poné un protocolo de ejemplo por capa: suma.</p>
<h3>4. Estructura del disco (1 pt)</h3>
<p>✓ <b>Las particiones son divisiones lógicas del disco, cada una con su propio sistema de archivos, y el MBR contiene tanto el código de arranque como la tabla de particiones.</b> Las otras son falsas: el MBR está en el <b>primer</b> sector, y sí tiene relación con las particiones.</p>
<h3>5. NTFS (1 pt)</h3>
<p>✓ <b>Es el sistema de archivos de Windows NT, con seguridad avanzada y registro de cambios (journaling).</b> No es de Linux (Linux usa ext4) ni es un formato antiguo de archivos pequeños (eso describe mejor a FAT).</p>
<h3>6. ¿Qué es UFW y qué función cumple? (1 pt)</h3>
<div class="key"><p><b>UFW (Uncomplicated Firewall)</b> es la herramienta por defecto de Ubuntu para administrar el firewall de forma simple. Es una <b>capa de abstracción sobre iptables</b>: cada regla de UFW se traduce a reglas de iptables, que es el motor real. Su función es filtrar el tráfico entrante y saliente, permitiendo o bloqueando conexiones por puerto, protocolo o IP. Ejemplos: <code>ufw enable</code>, <code>ufw allow 80/tcp</code>, <code>ufw deny 23/tcp</code>, <code>ufw status numbered</code>. Además ofrece perfiles por servicio, logs para auditoría e integración con systemd.</p></div>
<h3>7. Ventaja de los SO en la nube (1 pt)</h3>
<p>✓ <b>Escalabilidad elástica, tolerancia a fallos y optimización de costos con el modelo Opex y Edge Computing.</b> Las otras dos opciones dicen lo contrario: pago inicial fijo con arquitectura monolítica, y hardware local con alta latencia.</p>
<h3>8. ¿Es viable reemplazar las PCs de la facultad por escritorios en la nube? (2 pts)</h3>
<div class="key"><p><b>Postura:</b> viable en gran parte, pero como <b>modelo híbrido</b> y no como reemplazo total. <b>A favor</b> (VDI/DaaS: Azure Virtual Desktop, Amazon WorkSpaces, Citrix DaaS): acceso universal desde cualquier dispositivo; seguridad centralizada; mantenimiento y backups automatizados; escalabilidad en época de exámenes; pago por uso (Opex); y los equipos viejos se pueden reutilizar con ChromeOS Flex. <b>En contra:</b> dependencia de Internet; latencia en aplicaciones gráficas (CAD, simulaciones); costos recurrentes; capacitación. Además, siempre hace falta un dispositivo físico para conectarse. <b>Conclusión:</b> migrar los laboratorios de uso general y mantener algunos puestos físicos para lo que exige hardware dedicado.</p></div>
<h3>9. Evaluación integral para elegir un SO (1 pt)</h3>
<p>✓ <b>Analizar en conjunto la compatibilidad del hardware (procesador, RAM, almacenamiento), el rendimiento esperado, la seguridad y la experiencia de usuario.</b></p>

<template id="L-pdesa">
<p>Respuestas modelo listas para escribir en la hoja. En desarrollo confirmaron <b>Sistemas de archivos</b> y <b>Procesos</b>; en opinión, <b>NPU</b>, <b>Elección de SO</b> y <b>Tendencias globales</b>.</p>
<div class="key"><h4>Método para el desarrollo</h4><p>Memorizá el <b>esqueleto</b> (el orden de los temas) y escribí un párrafo por cada punto. Si seguís el esqueleto, no te salteás nada.</p></div>
<h3>Desarrollo 1 · Sistemas de archivos</h3>
<pre class="term">ESQUELETO: 3 requisitos → archivo (nombre, estructura, tipos, acceso,
atributos, operaciones) → directorios → disco (MBR → partición →
superbloque → bloques libres → inodo → raíz) → asignación (contigua,
enlazada, FAT, inodos) → ejemplos + journaling → tendencias → conclusión</pre>
<p><b>Introducción.</b> Las aplicaciones necesitan guardar información que cumpla tres condiciones: gran capacidad, persistencia después de que termina el proceso, y acceso concurrente de varios procesos. Para eso el SO usa la abstracción <b>archivo</b>, administrada por el sistema de archivos.</p>
<p><b>El archivo</b> es una unidad lógica de información persistente creada por los procesos. Se identifica por un nombre (UNIX distingue mayúsculas de minúsculas; MS-DOS no). Puede ser una secuencia de bytes (UNIX y Windows), registros de longitud fija o un árbol de registros con llave (bases de datos). Hay archivos <b>regulares</b>, <b>directorios</b>, <b>especiales de caracteres</b> (/dev/tty) y <b>especiales de bloques</b> (discos). El acceso puede ser <b>secuencial</b> o <b>aleatorio</b>. Tiene <b>atributos</b> (dueño, permisos, banderas, fechas, tamaño) y admite operaciones como create, delete, open, close, read, write, append, seek y rename.</p>
<p><b>Directorios.</b> Se organizan en un árbol jerárquico desde la raíz <code>/</code>, con rutas absolutas o relativas, y enlaces duros y simbólicos.</p>
<p><b>Estructura en disco.</b> El <b>MBR</b>, en el primer sector, tiene el código de arranque y la tabla de particiones. Cada <b>partición</b> tiene su FS, y al principio un <b>superbloque</b> con el tipo de FS, el tamaño, los bloques libres y ocupados, la cantidad de inodos y la ubicación de la raíz. Los bloques libres (de unos 4 KB) se controlan con un <b>mapa de bits</b> o una <b>lista enlazada</b>. Cada archivo tiene un <b>inodo</b> con todo menos el nombre (permisos, dueño, fechas, tamaño y punteros a bloques); el nombre está en la entrada del directorio.</p>
<p><b>Asignación.</b> La <b>contigua</b> es rápida pero fragmenta. La <b>lista enlazada</b> no fragmenta pero es lenta. La <b>FAT</b> es una tabla con el orden de los bloques, limitada en discos grandes. Los <b>inodos</b> son el método de UNIX/Linux.</p>
<p><b>Ejemplos.</b> FAT16/32 (MS-DOS), NTFS (Windows NT y posteriores, con journaling, ACL y cifrado), ext2/3/4 (Linux; ext3 agregó journaling), ISO 9660/UDF (CD/DVD). También exFAT, APFS, ZFS y ReFS.</p>
<p><b>Tendencias y conclusión.</b> Unos 175 ZB de datos en 2025, StaaS, IA, Zero Trust, nube híbrida y NVMe/PCIe 7.0. El sistema de archivos es una pieza esencial del SO, porque permite almacenar y recuperar información de forma persistente, organizada y segura.</p>

<h3>Desarrollo 2 · Procesos</h3>
<pre class="term">ESQUELETO: definición + PID + BCP (8) → creación (4) y terminación (4) →
5 estados + transiciones → concurrencia → planificación (objetivos,
CPU vs E/S, algoritmos) → IPC → carrera → región crítica (4 cond.) →
interrupciones, lock, Peterson, TSL, semáforos → productor–consumidor → conclusión</pre>
<p><b>Definición.</b> Un proceso es un programa en ejecución, con su propia memoria, su estado y sus recursos. Se identifica con un PID, y el SO guarda en el <b>BCP</b> su identificador, estado, prioridad, contador de programa, punteros a memoria, contexto (registros), información de E/S y contabilidad. Esto permite interrumpirlo y retomarlo: es la base de la multiprogramación.</p>
<p><b>Ciclo de vida.</b> Se crea por lote, por sesión interactiva, por un servicio del SO o por otro proceso. Termina por fin normal, porque lo detiene el padre, porque se cierra la sesión o por un error. Pasa por los estados <b>Nuevo → Listo → Ejecución → Bloqueado → Terminado</b>: admisión, planificación, espera de E/S, evento completado, fin de quantum o expropiación, y fin. Un bloqueado siempre vuelve a Listo. En un monoprocesador hay <b>pseudoparalelismo</b>; en un multiprocesador, paralelismo real.</p>
<p><b>Planificación.</b> El planificador decide quién usa la CPU, buscando equidad, rendimiento, tiempo de respuesta y balance. Algoritmos: <b>FCFS</b> (simple, con esperas largas), <b>SJF</b> (mínima espera promedio, pero hay que conocer la duración), <b>SRTF</b> (SJF expropiativo), <b>Prioridades</b> (riesgo de inanición) y <b>Round Robin</b> (quantum fijo, justo e interactivo).</p>
<p><b>Sincronización.</b> La IPC resuelve el pasaje de información, la interferencia y la sincronización. Cuando el resultado depende del orden de acceso a un recurso compartido, hay una <b>condición de carrera</b>. Se evita con <b>exclusión mutua</b> sobre la <b>región crítica</b>, que debe cumplir 4 condiciones: uno solo a la vez, no suponer velocidades, fuera de la RC no se bloquea a nadie, y nadie espera para siempre. Soluciones: deshabilitar interrupciones (no conviene), variable lock (no es atómica), <b>Peterson</b> (2 procesos, espera activa), <b>TSL</b> (atómica) y <b>semáforos de Dijkstra</b> (down y up atómicos). Ejemplo clásico: el <b>productor–consumidor</b>, donde con sleep/wakeup se pierden señales y con semáforos no.</p>
<p><b>Conclusión.</b> El proceso es la unidad básica de ejecución. Se gestiona con el BCP, se planifica con distintos algoritmos y se sincroniza para cooperar sin condiciones de carrera.</p>

<h3>Opinión · cómo armarla</h3>
<p><b>Postura</b> en la primera línea → <b>2 o 3 argumentos</b> con términos de la materia y un ejemplo real → <b>contraargumento</b> → <b>conclusión</b> matizada ("depende del contexto", "modelo híbrido").</p>
<h3>Opinión 1 · NPU</h3>
<p>Creo que la NPU se va a volver un componente estándar, como pasó con la GPU. <b>A favor:</b> permite IA local (privacidad, sin Internet, menos latencia); es mucho más eficiente en energía que la CPU o la GPU (más batería); y obliga al SO a evolucionar, con drivers, APIs (Windows ML, Core ML) y un planificador heterogéneo entre CPU, GPU y NPU (Windows 11 Copilot+ exige 40 TOPS). <b>En contra:</b> hoy pocas apps la aprovechan, encarece el equipo y cada fabricante tiene su propio software. <b>Conclusión:</b> para un administrativo todavía no es indispensable, pero va a ser un criterio más al elegir hardware y SO.</p>
<h3>Opinión 2 · Elección de SO</h3>
<p>No existe un SO "mejor": el más eficiente es el que equilibra compatibilidad, rendimiento, seguridad, software, soporte y costo para un uso concreto. La <b>compatibilidad de hardware</b> es lo primero: la incompatibilidad degrada el rendimiento entre 40 y 60 %. Ejemplo: el <b>fin del soporte de Windows 10 (octubre de 2025)</b> dejó PCs sin parches, y Lubuntu, Zorin OS Lite o ChromeOS Flex les dan una segunda vida. Según el perfil: Windows para administración y Office, macOS para diseño, Linux para servidores y desarrollo. En contra, migrar tiene costos de capacitación y de compatibilidad, así que conviene probar antes con dual-boot o una VM. <b>Conclusión:</b> es una decisión estratégica basada en el análisis del hardware, del uso y del soporte a largo plazo.</p>
<h3>Opinión 3 · Tendencias globales</h3>
<p>La tendencia es pasar a un modelo <b>híbrido, distribuido y con IA</b>. Hay unos 175 ZB de datos, que impulsan la nube híbrida y el StaaS (pago por uso, escalabilidad, SLA superior al 99,99 %). La IA está en el almacenamiento y en el hardware (NPU). La seguridad pasa a <b>Zero Trust</b> y el procesamiento se acerca al usuario con el <b>edge</b>. Como riesgos: la dependencia de pocos proveedores, la privacidad, los costos recurrentes y el <b>consumo energético</b> (por eso la sostenibilidad también es una tendencia). <b>Conclusión:</b> el futuro es híbrido, con la nube para escalar y el procesamiento local para la privacidad y la latencia.</p>

<pre class="term"><span class="p">$</span> mkdir -p backups &amp;&amp; rsync -avz --exclude '*.tmp' ~/lab_seguridad/ ~/backups/ &gt;&gt; entrega.txt   <span class="c"># 27</span>

<span class="p">$</span> crontab -e     <span class="c"># 29: agregar la línea</span>

<span class="p">$</span> crontab -l &gt;&gt; entrega.txt   <span class="c"># 30</span></pre>
<h3>La versión corta (5 misiones)</h3>
<ul>
<li><b>M1, el secreto escondido:</b> crear secreto.txt, <code>chmod 600</code>, y guardar <code>ls -l</code> y <code>cat</code> en entrega.txt.</li>
<li><b>M2, la caja fuerte:</b> comprimir con <code>zip -e</code> o con <code>tar</code> y guardarlo en backups/.</li>
<li><b>M3, el respaldo personal:</b> <code>mkdir -p backups</code> y copiar al menos 2 archivos con cp o rsync.</li>
<li><b>M4, el explorador:</b> <code>find ~ -name "*.txt"</code> y <code>grep "palabra" archivo.txt</code>.</li>
<li><b>M5, el cron vigilante:</b> <code>*/5 * * * * cp /home/usuario/secreto.txt /home/usuario/backups/</code> y después <code>crontab -l &gt;&gt; entrega.txt</code>.</li>
</ul>
<h3>Misión 6 · Cuestionario (respuestas)</h3>
<ol>
<li><b>UFW e iptables:</b> UFW es una interfaz simplificada sobre iptables; sus reglas se traducen a iptables, que es el motor real.</li>
<li><b>SSH entrante al puerto 22:</b> se evalúa en la cadena <b>INPUT</b> de la tabla filter.</li>
<li><b>DROP vs REJECT:</b> DROP descarta en silencio y el cliente espera hasta un timeout; REJECT descarta y avisa al emisor.</li>
<li><b>Fail2ban:</b> lee los logs y banea en el firewall la IP que supera <b>maxretry</b> fallos dentro de <b>findtime</b>, durante <b>bantime</b>.</li>
<li><b>rsync + cron:</b> rsync es incremental y conserva atributos; cron lo automatiza sin intervención humana. Con el log se puede auditar cada ejecución.</li>
</ol>
<h3>Descargar la entrega</h3>
<p>Desde tu PC: <code>scp tu_usuario@IP_DEL_SERVIDOR:~/entrega.txt ~/Desktop/</code> (en PowerShell, el destino es <code>C:\Users\TUUSUARIO\Desktop\</code>), o con <b>WinSCP</b> arrastrando el archivo.</p>

<h3>TP Sistemas de archivos</h3>

<h3>TP Tanenbaum: respuestas por parte</h3>
<p class="hint">El texto de la entrevista no está en el material que me pasaste; esto es lo conocido públicamente de Tanenbaum. Ajustalo con lo que dice él en la entrevista que vieron en clase.</p>
<ul>
<li><b>P1.1</b> Estudió física, pero la informática le resultó más interesante y con más futuro práctico.</li>
<li><b>P1.2</b> Sus libros (<i>Sistemas Operativos Modernos</i>, <i>Redes</i>, <i>Organización de Computadoras</i>) formaron a generaciones porque unen la teoría con código real.</li>
<li><b>P1.3</b> Creó <b>MINIX</b> (1987) porque AT&amp;T prohibió enseñar el código de UNIX V7, y publicó todo el código en el libro para que los alumnos estudiaran un SO real. MINIX inspiró a Linux.</li>
<li><b>P2.1</b> El <b>microkernel</b> deja en el kernel solo lo mínimo y pone los drivers en modo usuario: es más confiable, pero más lento. El <b>monolítico</b> pone todo en el kernel: es más rápido, pero un bug puede tirar todo. En el debate de 1992 ("LINUX is obsolete"), Tanenbaum dijo que lo monolítico era un retroceso y que Linux era poco portable.</li>
<li><b>P2.2</b> Las ideas "vuelven" cuando cambian los costos relativos del hardware (el trade-off memoria/CPU, la planificación de disco).</li>
<li><b>P2.3</b> Los SSD, las GPU, las NPU y los coprocesadores criptográficos suman drivers, planificación y seguridad, y hacen al SO más complejo.</li>
<li><b>P3.1</b> Es cauteloso con la IA en sistemas críticos, porque es difícil verificar que sea correcta.</li>
<li><b>P3.2</b> Los SO se complican por la diversidad de hardware y por los requisitos de seguridad.</li>
<li><b>P3.3</b> "La mitad del rendimiento por el doble de confiabilidad": de acuerdo para sistemas críticos (CrowdStrike 2024, aviación, medicina); en gaming o HPC se valora más la velocidad.</li>
<li><b>P4.1</b> Recomienda enseñar <b>principios y algoritmos duraderos</b>, no herramientas como Word o Excel, que cambian.</li>
<li><b>P4.2</b> Dos principios atemporales: la <b>virtualización/abstracción</b> (memoria virtual → VMs, contenedores, EC2) y el <b>aislamiento y mínimo privilegio</b> (microkernel → sandboxing en Android e iOS, pestañas de Chrome, permisos 600/700).</li>
</ul>

 [`¿Cuál es el rango de los puertos bien conocidos?`,`0 a 1023`,[`1024 a 49151`,`49152 a 65535`,`0 a 65535`],`HTTP 80, HTTPS 443, FTP 21, SMTP 25.`],

tfs:[
 [`¿Cuáles son las 3 condiciones que debe cumplir el almacenamiento?`,`Guardar mucha información, que persista después del proceso y que varios procesos accedan a la vez`,[`Ser rápido, barato y cifrado`,`Tener journaling, permisos y cuotas`,`Estar en la nube, en local y en un backup`],`Para cumplirlas se usa la abstracción "archivo".`],
 [`¿Qué es un archivo?`,`Una unidad lógica de información persistente creada por los procesos`,[`Un sector físico del disco`,`Un proceso guardado`,`Una partición`],`Lo administra el SO.`],
 [`¿Qué diferencia hay entre los nombres de archivo en UNIX y en MS-DOS?`,`UNIX distingue mayúsculas de minúsculas; MS-DOS no`,[`MS-DOS distingue y UNIX no`,`Ninguno distingue`,`UNIX no admite extensiones`],`En UNIX, Nota.txt y nota.txt son dos archivos distintos.`],
 [`¿Cómo está estructurado internamente un archivo en UNIX y en Windows?`,`Como una secuencia de bytes sin estructura`,[`Como un árbol de registros con llave`,`Como registros de longitud fija`,`Como inodos encadenados`],`El árbol con llave se usa en bases de datos.`],
 [`¿Dónde se usa la estructura de árbol de registros con llave?`,`En sistemas de bases de datos`,[`En UNIX`,`En FAT32`,`En el MBR`],`Las otras estructuras son la secuencia de bytes y los registros de longitud fija.`],
 [`¿Qué contienen los archivos regulares?`,`Datos del usuario (texto o binarios)`,[`La estructura del FS`,`Dispositivos`,`Inodos`],`Los directorios contienen la estructura.`],
 [`/dev/tty y /dev/lp0 son archivos…`,`Especiales de caracteres (E/S en serie)`,[`Especiales de bloques`,`Regulares`,`Directorios`],`La terminal y la impresora.`],
 [`¿Qué son los archivos especiales de bloques?`,`Los que representan dispositivos de almacenamiento, como discos`,[`Las terminales`,`Los textos grandes`,`Los ejecutables`],`Los de caracteres son la E/S en serie.`],
 [`¿Qué es el acceso secuencial?`,`Leer los datos desde el principio y en orden, como en una cinta`,[`Ir directo a cualquier posición`,`Leer solo el final`,`Leer en paralelo`],`El aleatorio permite saltar a cualquier parte.`],
 [`¿Qué es el acceso aleatorio?`,`Leer o escribir en cualquier parte del archivo sin seguir un orden`,[`Leer al azar sin control`,`Leer como una cinta`,`Acceder solo a los metadatos`],`Se usa Seek para moverse.`],
 [`¿Cuál de estos NO es un atributo (metadato) de un archivo?`,`Su contenido`,[`El propietario`,`La fecha de modificación`,`La bandera de oculto`],`Los atributos describen al archivo, no son su contenido.`],
 [`¿Qué hace la operación Seek?`,`Mueve el puntero de lectura y escritura dentro del archivo`,[`Busca un archivo en el disco`,`Borra el archivo`,`Cambia su nombre`],`Se usa con el acceso aleatorio.`],
 [`¿Qué hace la operación Append?`,`Agrega información al final del archivo`,[`Lo sobrescribe`,`Lo renombra`,`Lo cierra`],`Equivale a >> en la shell.`],
 [`¿Por qué los sistemas modernos usan directorios jerárquicos?`,`Porque un solo nivel de directorio es simple, pero poco práctico`,[`Porque ocupan menos espacio`,`Porque son más seguros`,`Porque lo exige el MBR`],`Forman un árbol que parte de la raíz.`],
 [`¿Cuál es una ruta absoluta?`,`/home/santi/documento.txt`,[`documento.txt`,`../documento.txt`,`santi/documento.txt`],`Empieza desde la raíz /.`],
 [`¿Dónde está el MBR y qué contiene?`,`En el primer sector del disco; contiene el código de arranque y la tabla de particiones`,[`Al final del disco; contiene datos de usuario`,`En cada partición; contiene los inodos`,`En la RAM; contiene el kernel`],`Pregunta del parcial anterior.`],
 [`¿Qué pasa si se daña el MBR?`,`El sistema no puede arrancar ni localizar las particiones`,[`Se pierden solo los archivos ocultos`,`Nada, hay copias`,`Se borra el superbloque`],`Ahí están el bootloader y la tabla de particiones.`],
 [`¿Qué es una partición?`,`Una división del disco en una sección independiente, con su propio sistema de archivos`,[`Un archivo grande`,`Un sector dañado`,`Un tipo de inodo`],`Por ejemplo, una partición ext4 y otra NTFS.`],
 [`¿Qué guarda el superbloque?`,`El tipo de FS, el tamaño, los bloques libres y ocupados, la cantidad de inodos y la ubicación de la raíz`,[`El código de arranque`,`El contenido de los archivos`,`Los nombres de todos los archivos`],`Es el "mapa general" de la partición.`],
 [`¿Qué puede pasar si se daña el superbloque?`,`Se puede perder el acceso a los datos de la partición`,[`Solo se pierde el MBR`,`Nada`,`Se borra la RAM`],`Por eso los FS guardan copias del superbloque.`],
 [`¿De qué tamaño suelen ser los bloques de un sistema de archivos?`,`4 KB`,[`512 MB`,`1 byte`,`64 GB`],`El bloque es la unidad mínima de almacenamiento.`],
 [`En un mapa de bits de bloques libres…`,`0 indica libre y 1 ocupado`,[`1 indica libre y 0 ocupado`,`Cada bit es un archivo`,`Cada bit es un inodo`],`La otra opción es la lista enlazada.`],
 [`¿Cómo funciona la lista enlazada de bloques libres?`,`Cada bloque libre apunta al siguiente bloque libre`,[`Un bit por bloque`,`Una tabla en el MBR`,`El inodo guarda los libres`],`Es la alternativa al bitmap.`],
 [`¿Qué NO guarda el inodo?`,`El nombre del archivo`,[`Los permisos`,`Los punteros a los bloques`,`Las fechas`],`El nombre está en la entrada del directorio.`],
 [`En UNIX, ¿qué contiene una entrada de directorio?`,`El nombre del archivo y el número de inodo`,[`Todos los atributos`,`El contenido`,`El superbloque`],`La información real está en el inodo.`],
 [`¿Cuál es la característica de la asignación contigua?`,`Es muy rápida pero genera fragmentación`,[`Es lenta pero sin fragmentación`,`Usa una tabla FAT`,`Usa inodos`],`Los bloques van consecutivos.`],
 [`¿Cuál es la característica de la asignación por lista enlazada?`,`Elimina la fragmentación pero hace más lento el acceso`,[`Es la más rápida`,`Necesita bloques consecutivos`,`Es la que usa NTFS`],`Hay que recorrer la cadena de bloques.`],
 [`¿Qué es FAT?`,`Una tabla que indica el orden de los bloques de cada archivo; es eficiente pero limitada en discos grandes`,[`Un tipo de inodo`,`El sector de arranque`,`Un permiso`],`File Allocation Table.`],
 [`¿Qué método de asignación usa UNIX/Linux?`,`Nodos-i (inodos)`,[`FAT`,`Contigua`,`Lista enlazada`],`Es el más avanzado de los cuatro.`],
 [`¿Hasta cuántos caracteres admiten los nombres largos en la mayoría de los FS modernos?`,`255`,[`8`,`32`,`1024`],`MS-DOS usaba 8 + 3.`],
 [`¿Qué FS usa Windows NT y posteriores?`,`NTFS`,[`FAT16`,`ext4`,`ISO 9660`],`MS-DOS usaba FAT16 o FAT32.`],
 [`¿Qué FS usan los CD y DVD?`,`ISO 9660 o UDF`,[`NTFS`,`ext3`,`APFS`],`Están optimizados para medios ópticos.`],
 [`¿Cuántos datos se estima que habría en el mundo en 2025?`,`175 zettabytes`,[`175 terabytes`,`17 petabytes`,`1.750 exabytes`],`Por IoT, multimedia, IA y nube.`],
 [`¿Qué es StaaS?`,`Contratar almacenamiento externo como servicio, en lugar de tener infraestructura propia`,[`Un sistema de archivos`,`Un tipo de SSD`,`Un protocolo de red`],`Storage as a Service.`],
 [`¿Qué es la arquitectura Zero Trust?`,`Verificar continuamente la identidad y no asumir que algo interno es confiable`,[`No tener contraseñas`,`Confiar en toda la red interna`,`Un antivirus`],`Es una de las tendencias de 2025.`],
],
tfscomp:[
 [`¿Cuál es el tamaño máximo de archivo en FAT32?`,`4 GB`,[`2 GB`,`16 TB`,`Ilimitado`],`Por eso una ISO de 5 GB no entra en un pendrive FAT32.`],
 [`¿Qué tienen en común FAT16, FAT32 y exFAT?`,`Ninguno tiene journaling ni permisos`,[`Los tres son de Linux`,`Los tres tienen cifrado`,`Los tres usan copy-on-write`],`Son simples y compatibles.`],
 [`¿Qué FS es el estándar del disco de sistema de Windows?`,`NTFS`,[`FAT32`,`exFAT`,`ReFS`],`ReFS es para servidores.`],
 [`¿Qué características tiene NTFS?`,`Journaling, permisos ACL, cifrado EFS, compresión y cuotas`,[`Sin permisos ni journaling`,`Copy-on-write y RAID-Z`,`Solo lectura`],`Es más seguro y avanzado que FAT.`],
 [`¿Qué puede hacer macOS con un disco NTFS de forma nativa?`,`Leerlo, pero no escribir`,[`Leerlo y escribirlo`,`Nada`,`Formatearlo solamente`],`Para escribir necesita software adicional.`],
 [`¿Qué versión de ext agregó el journaling?`,`ext3`,[`ext2`,`ext4`,`ext1`],`ext2 no tiene journaling.`],
 [`¿Cuál es el tamaño máximo de archivo en ext4?`,`16 TB`,[`4 GB`,`2 GB`,`8 EB`],`El volumen puede llegar a 1 EB.`],
 [`¿Para qué se creó exFAT?`,`Para memorias flash (pendrives y SDXC) sin el límite de 4 GB de FAT32`,[`Para servidores`,`Para CD-ROM`,`Para el disco de arranque de Linux`],`Lo creó Microsoft en 2006.`],
 [`¿Qué FS conviene para un pendrive de 64 GB que se va a usar en Windows, Mac y Linux con archivos grandes?`,`exFAT`,[`FAT32`,`NTFS`,`ext4`],`Es compatible con los tres y no tiene el límite de 4 GB.`],
 [`¿Cuál es la desventaja principal de exFAT?`,`No tiene journaling: se puede corromper si se desconecta sin expulsar`,[`Tiene un límite de 4 GB`,`Solo funciona en Linux`,`Es muy lento`],`No tiene journaling ni permisos.`],
 [`¿Dónde se usa ReFS?`,`En Windows Server y Storage Spaces`,[`En pendrives`,`En iPhone`,`En Android`],`Apareció con Windows Server 2012.`],
 [`¿Qué destaca de ReFS?`,`La integridad: checksums y autorreparación de datos`,[`La compatibilidad con MS-DOS`,`Que es el más liviano`,`Que funciona en CD`],`ReFS = Resilient File System.`],
 [`¿Qué limitación tiene ReFS?`,`No sirve como disco de arranque de Windows`,[`Tiene un límite de 4 GB`,`No tiene permisos`,`Solo existe en Linux`],`Se usa para volúmenes de datos.`],
 [`¿De quién es APFS y desde cuándo?`,`De Apple, desde 2017`,[`De Microsoft, desde 2006`,`De Sun, desde 2005`,`De Linux, desde 2008`],`Lo usan macOS, iOS, iPadOS y watchOS.`],
 [`¿Qué caracteriza a APFS?`,`Copy-on-write, snapshots, clones instantáneos, cifrado nativo y optimización para SSD`,[`Sin cifrado ni snapshots`,`Límite de 4 GB`,`Es exclusivo de servidores Windows`],`Su desventaja: es exclusivo del ecosistema Apple.`],
 [`¿Quién creó ZFS?`,`Sun Microsystems, en 2005 (hoy lo mantiene OpenZFS)`,[`Apple`,`Microsoft`,`Google`],`Se usa en TrueNAS, FreeBSD y Proxmox.`],
 [`¿Qué caracteriza a ZFS?`,`Copy-on-write, checksums de punta a punta, autorreparación, RAID-Z, snapshots y compresión`,[`Es simple y sin permisos`,`Tiene un límite de 4 GB`,`Solo sirve para CD`],`Es de 128 bits.`],
 [`¿Cuál es una desventaja de ZFS?`,`Consume mucha RAM y su licencia CDDL impide incluirlo en el kernel Linux`,[`No tiene snapshots`,`Se corrompe sin journaling`,`No admite archivos grandes`],`Por eso en Linux se instala aparte.`],
 [`¿Qué es el journaling?`,`Registrar en un log los cambios antes de aplicarlos, para recuperar la consistencia tras un corte`,[`Cifrar los archivos`,`Comprimir el disco`,`Copiar el disco a la nube`],`Lo tienen NTFS, ext3 y ext4.`],
 [`¿Qué es copy-on-write?`,`Escribir los cambios en un bloque nuevo y recién después cambiar el puntero, sin sobrescribir en el lugar`,[`Copiar el archivo cada vez que se lee`,`Escribir dos veces lo mismo`,`Un tipo de backup en la nube`],`Permite snapshots. Lo usan APFS, ZFS y ReFS.`],
 [`¿Qué comando de Linux muestra el tipo de FS de cada partición?`,`df -T (o lsblk -f)`,[`ls -l`,`free -h`,`uname -a`],`T = type.`],
 [`¿Qué FS no puede leer Windows de forma nativa?`,`ext4`,[`NTFS`,`FAT32`,`exFAT`],`Se necesita software adicional.`],
],
tseg:[
 [`¿Qué es un firewall?`,`Un sistema que monitorea el tráfico entrante y saliente y lo permite o bloquea según reglas`,[`Un antivirus`,`Un sistema de backup`,`Un tipo de cifrado de disco`],`Funciona como filtro entre la red interna y el exterior.`],
 [`¿Qué relación hay entre UFW e iptables?`,`UFW es una capa de abstracción simple sobre iptables; cada regla de UFW se traduce a iptables`,[`UFW reemplaza a iptables`,`iptables es una interfaz de UFW`,`No tienen relación`],`iptables es el motor real.`],
 [`¿Cuál es el firewall por defecto de Ubuntu?`,`UFW`,[`Fail2ban`,`pfSense`,`Windows Defender`],`Uncomplicated Firewall.`],
 [`¿Qué criterios puede usar iptables en una regla?`,`Protocolo, puertos, IP, interfaz y estado de la conexión`,[`Solo el puerto`,`Solo la IP`,`El nombre del usuario`],`Por eso es potente pero complejo.`],
 [`¿Qué características extra ofrece UFW?`,`Comandos simples, perfiles por servicio, logs para auditoría e integración con systemd`,[`Cifrado de disco`,`Copias automáticas`,`Antivirus`],`Son las que menciona el apunte.`],
 [`¿Cuál es la tabla principal de iptables, la que permite o bloquea?`,`filter`,[`nat`,`mangle`,`raw`],`Sus cadenas son INPUT, OUTPUT y FORWARD.`],
 [`¿Qué controla la cadena INPUT?`,`Los paquetes que entran al equipo`,[`Los que salen`,`Los que pasan a través`,`Los que cambian de IP`],`Por ejemplo, SSH entrante.`],
 [`¿Qué controla la cadena FORWARD?`,`Los paquetes que pasan a través del equipo, cuando funciona como router`,[`Los que entran`,`Los que salen`,`Los de la loopback`],`No son ni para él ni de él.`],
 [`¿Qué diferencia hay entre DROP y REJECT?`,`DROP descarta sin responder; REJECT descarta y manda un mensaje de rechazo`,[`Son iguales`,`REJECT acepta el paquete`,`DROP registra y REJECT no`],`ACCEPT deja pasar.`],
 [`¿Para qué sirve la tabla nat?`,`Para modificar las direcciones IP: compartir una IP pública o redirigir tráfico`,[`Para bloquear puertos`,`Para marcar QoS`,`Para evitar conntrack`],`NAT = Network Address Translation.`],
 [`¿En qué cadena se hace DNAT (cambiar el destino)?`,`PREROUTING`,[`POSTROUTING`,`INPUT`,`FORWARD`],`Antes de rutear se decide adónde va el paquete.`],
 [`¿En qué cadena se hace SNAT (cambiar el origen)?`,`POSTROUTING`,[`PREROUTING`,`INPUT`,`OUTPUT de filter`],`Al salir se cambia de quién viene.`],
 [`Redirigir el tráfico del puerto 8080 al 80 de 192.168.1.50 es un ejemplo de…`,`DNAT`,[`SNAT`,`Masquerading`,`DROP`],`Cambia el destino.`],
 [`Reemplazar la IP de origen de la red 192.168.1.0/24 por la IP pública 203.0.113.1 es un ejemplo de…`,`SNAT`,[`DNAT`,`mangle`,`raw`],`Cambia el origen.`],
 [`¿Qué es Masquerading?`,`Una variante de SNAT para cuando la IP pública cambia de forma dinámica`,[`Un tipo de DROP`,`Cifrado de paquetes`,`Ocultar puertos`],`Es típico de las conexiones hogareñas.`],
 [`¿Para qué sirve la tabla mangle?`,`Para modificaciones avanzadas: marcar para QoS, cambiar TOS/DSCP o alterar el TTL`,[`Para bloquear tráfico`,`Para traducir IP`,`Para hacer backups`],`QoS = calidad de servicio.`],
 [`¿Para qué sirve la tabla raw?`,`Para manipular paquetes antes del seguimiento de conexiones (conntrack), por ejemplo para que no se rastreen`,[`Para guardar paquetes sin procesar en disco`,`Para el NAT`,`Para bloquear todo`],`Mejora el rendimiento con mucho tráfico.`],
 [`¿Contra qué protege Fail2ban?`,`Contra ataques de fuerza bruta, como bots que prueban contraseñas por SSH`,[`Contra virus`,`Contra cortes de luz`,`Contra spam`],`Lee los logs y banea IP.`],
 [`¿Cómo actúa Fail2ban?`,`Monitorea los logs, detecta intentos fallidos y bloquea temporalmente la IP del atacante`,[`Cifra SSH`,`Cambia la contraseña`,`Apaga el servidor`],`El bloqueo es temporal: dura lo que diga bantime.`],
 [`En Fail2ban, ¿qué es bantime y cuánto vale por defecto?`,`El tiempo que la IP queda bloqueada; 600 segundos`,[`Los intentos; 5`,`La ventana; 10 minutos`,`El puerto; 22`],`600 s = 10 min.`],
 [`En Fail2ban, ¿qué es findtime?`,`El período en el que se cuentan los intentos fallidos`,[`El tiempo de bloqueo`,`El tiempo para buscar logs`,`El intervalo de cron`],`maxretry = cantidad de intentos.`],
 [`¿Por qué se configura Fail2ban en jail.local y no en jail.conf?`,`Para que las actualizaciones del paquete no pisen tu configuración`,[`Porque jail.conf no existe`,`Porque jail.local es más rápido`,`Porque lo exige systemd`],`Es una buena práctica.`],
 [`¿Contra qué protegen las copias de seguridad regulares?`,`Contra fallos del sistema, ataques y errores humanos`,[`Solo contra virus`,`Contra la lentitud`,`Contra el spam`],`Lo dice el apunte.`],
 [`¿Qué herramientas propone el apunte para los backups automáticos?`,`rsync y cron`,[`tar y ufw`,`zip y fail2ban`,`scp y iptables`],`rsync copia y cron automatiza.`],
],

tnube:[
 [`¿Qué es un SO en la nube?`,`Una plataforma de software distribuida que gestiona recursos virtualizados en datacenters`,[`Un SO instalado en un pendrive`,`Un antivirus en línea`,`Un sistema de archivos`],`Trabaja bajo modelos IaaS y PaaS.`],
 [`¿Cuál es el objetivo de un SO en la nube?`,`Administrar recursos virtualizados (VMs, contenedores, microservicios) de forma eficiente, escalable y segura`,[`Reemplazar al hardware`,`Eliminar Internet`,`Gestionar un solo equipo físico`],`Opera sobre datacenters globales.`],
 [`¿Qué es serverless?`,`Ejecutar código sin administrar servidores`,[`No tener servidores en ninguna parte`,`Un servidor sin red`,`Un SO sin kernel`],`Ejemplos: AWS Lambda y Azure Functions.`],
 [`¿Qué es el edge computing?`,`Procesar los datos cerca del usuario final para reducir la latencia`,[`Procesar todo en un único datacenter`,`Un tipo de cifrado`,`Un navegador`],`Reduce también la energía y el ancho de banda.`],
 [`¿Qué son los microservicios?`,`Componentes modulares independientes en los que se divide una aplicación`,[`Servidores muy chicos`,`Procesos del kernel`,`Un tipo de CPU`],`Facilitan la escalabilidad y el mantenimiento.`],
 [`¿Qué hacen las CDN y los balanceadores de carga?`,`Optimizan el rendimiento global y reparten la carga`,[`Cifran discos`,`Crean VMs`,`Hacen backups`],`Son parte de la arquitectura de nube.`],
 [`¿Qué significa escalar de forma horizontal?`,`Agregar más máquinas`,[`Agregar más RAM o CPU a la misma máquina`,`Reducir recursos`,`Mover a otra región`],`Vertical = hacer más grande la misma máquina.`],
 [`¿Qué disponibilidad garantizan los SLA de la nube según el apunte?`,`Más del 99,99 %`,[`50 %`,`90 %`,`100 % garantizado siempre`],`Gracias a la replicación entre zonas de disponibilidad.`],
 [`¿Qué es una zona de disponibilidad (AZ)?`,`Un datacenter o grupo independiente dentro de una región, entre los que se replican los datos`,[`Un país`,`Una VM`,`Un puerto`],`Si cae una, sigue funcionando otra.`],
 [`¿Qué modelo de costos usa la nube?`,`Opex: pago por uso`,[`Capex: gran inversión inicial`,`Pago único de por vida`,`Gratuito`],`Elimina las grandes inversiones iniciales.`],
 [`¿Qué estándares de seguridad y cumplimiento menciona el apunte?`,`ISO 27001, SOC 2 y GDPR`,[`TCP/IP y OSI`,`FAT32 y NTFS`,`HTTP y FTP`],`Aseguran integridad y privacidad.`],
 [`¿Qué plataforma es líder en IaaS/PaaS, con más de 200 servicios?`,`AWS`,[`Azure`,`Google Cloud`,`Citrix`],`EC2, S3, Lambda y EKS.`],
 [`¿Qué es EC2 en AWS?`,`El servicio de máquinas virtuales`,[`El almacenamiento`,`Las funciones serverless`,`Kubernetes`],`S3 = almacenamiento, Lambda = serverless, EKS = Kubernetes.`],
 [`¿Qué es S3 en AWS?`,`El servicio de almacenamiento de objetos`,[`Las máquinas virtuales`,`Kubernetes`,`Un firewall`],`Simple Storage Service.`],
 [`¿Qué plataforma destaca en nubes híbridas e integración con productos Microsoft?`,`Azure`,[`AWS`,`Google Cloud`,`FydeOS`],`AKS y Azure Functions.`],
 [`¿Qué plataforma está orientada a big data, IA y machine learning?`,`Google Cloud Platform`,[`AWS`,`Azure`,`Citrix`],`GKE y Cloud Functions.`],
 [`¿Cuál de estos es un desafío de la arquitectura distribuida?`,`La consistencia de datos en entornos multi-tenant`,[`La falta de escalabilidad`,`El costo inicial alto`,`No tener redundancia`],`Otros: complejidad de los microservicios, latencia en el edge, seguridad.`],
 [`¿Qué es una nube privada?`,`Una infraestructura dedicada a una sola organización, con más control y cumplimiento`,[`Una nube gratis`,`Una nube compartida por todos`,`Una red Wi-Fi privada`],`La pública es compartida; la híbrida combina las dos.`],
 [`¿Qué es una nube híbrida?`,`La combinación de nube pública y privada, que equilibra flexibilidad, seguridad y costos`,[`Una nube sin Internet`,`Dos proveedores públicos`,`Una nube solo para IA`],`Permite mover cargas entre entornos.`],
 [`¿Qué es IaaS?`,`Infraestructura como servicio: máquinas virtuales y almacenamiento`,[`Software terminado por web`,`Una plataforma para programar`,`Un antivirus`],`Ejemplo: EC2.`],
 [`¿Qué es PaaS?`,`Una plataforma para desarrollar y ejecutar aplicaciones`,[`Hardware físico`,`Software terminado`,`Un SO de escritorio`],`No administrás servidores, solo tu app.`],
 [`¿Qué es SaaS?`,`Software completo accesible desde la web`,[`Máquinas virtuales`,`Un lenguaje de programación`,`Un tipo de disco`],`Ejemplos: Gmail y Office 365.`],
 [`¿Qué diferencia a un SO tradicional de uno en la nube?`,`El tradicional gestiona hardware físico local; el de nube se basa en virtualización y se despliega bajo demanda`,[`El de nube no tiene kernel`,`El tradicional es siempre gratis`,`No hay diferencia`],`El tradicional se instala localmente y escala poco.`],
 [`¿Qué es una AMI?`,`Una imagen preconfigurada de AWS para lanzar múltiples instancias idénticas`,[`Un disco virtual de Azure`,`Un archivo de instalación por USB`,`Un contenedor`],`Es la etapa "nube" de la evolución de las imágenes.`],
 [`¿Qué es un VHD?`,`Un disco virtual portable, usado por Azure`,[`Una imagen de AWS`,`Un CD`,`Un protocolo`],`Virtual Hard Disk.`],
 [`¿Cuál es el orden de evolución de los formatos de instalación?`,`ISO → VHD → AMI`,[`AMI → ISO → VHD`,`VHD → AMI → ISO`,`ISO → AMI → VHD`],`Física → virtualización → nube.`],
 [`¿Qué es un contenedor?`,`Virtualización liviana a nivel de SO, donde la app incluye todas sus dependencias`,[`Una VM completa con su propio hardware`,`Un archivo comprimido`,`Una partición`],`Garantiza portabilidad y consistencia.`],
 [`¿Qué hace Kubernetes?`,`Orquesta contenedores: automatiza el despliegue, el escalado y la recuperación ante fallos`,[`Crea máquinas físicas`,`Es un SO de escritorio`,`Comprime archivos`],`Es la base del modelo cloud-native.`],
 [`¿Qué características tiene ChromeOS?`,`Kernel Linux, actualizaciones automáticas, sandboxing y arranque verificado`,[`Kernel Windows`,`Sin actualizaciones`,`Solo funciona offline`],`Está centrado en la web.`],
 [`¿Qué es FydeOS?`,`Un derivado de Chromium OS con más privacidad y apps Android y Linux, sin depender de Google`,[`Un FS de Apple`,`Una distro de Windows`,`Una nube de AWS`],`Es un SO cloud-native.`],
 [`¿Quién creó CloudReady (hoy ChromeOS Flex)?`,`Neverware; después lo compró Google`,[`Microsoft`,`Apple`,`Canonical`],`Sirve para revivir hardware viejo.`],
 [`¿Cuál de estas es una plataforma de escritorios virtuales (VDI/DaaS)?`,`Azure Virtual Desktop`,[`Kubernetes`,`S3`,`Fail2ban`],`También están Citrix DaaS y Amazon WorkSpaces.`],
 [`¿Cuál es un desafío de los escritorios en la nube en educación?`,`La dependencia de una conexión estable a Internet`,[`El acceso universal`,`La seguridad centralizada`,`El mantenimiento automatizado`],`Los otros tres son beneficios.`],
],
tactual:[
 [`¿Qué es una NPU?`,`Un procesador especializado en operaciones de IA, de bajo consumo`,[`Una placa de red`,`Una unidad de disco`,`Un tipo de RAM`],`Neural Processing Unit.`],
 [`¿En qué unidad se mide el rendimiento de una NPU?`,`TOPS (billones de operaciones por segundo)`,[`GHz`,`GB`,`Mbps`],`Las PCs Copilot+ piden 40 TOPS o más.`],
 [`¿Qué diferencia a la NPU de la GPU?`,`La NPU está especializada en la inferencia de IA con muy bajo consumo; la GPU es más general y consume más`,[`La GPU no hace cálculos`,`Son iguales`,`La NPU es para gráficos`],`La CPU es de propósito general.`],
 [`¿Qué NPU mínima exige Microsoft para las PCs Copilot+?`,`40 TOPS o más`,[`1 TOPS`,`100 TOPS`,`No exige NPU`],`Intel Core Ultra, AMD Ryzen AI, Snapdragon X.`],
 [`¿Cuál es una ventaja de procesar IA en la NPU local?`,`Privacidad: los datos no salen del equipo, y además funciona sin Internet`,[`Es más caro`,`Necesita la nube`,`Consume más batería`],`También tiene menos latencia.`],
 [`¿Por qué la NPU hace más complejo al SO?`,`Porque el SO necesita drivers, APIs y un planificador que reparta tareas entre CPU, GPU y NPU`,[`Porque reemplaza al kernel`,`Porque elimina la CPU`,`No lo afecta`],`Es la computación heterogénea.`],
 [`¿Qué estudió Tanenbaum antes de dedicarse a la informática?`,`Física`,[`Medicina`,`Derecho`,`Música`],`Hizo la carrera en el MIT y el doctorado en Berkeley.`],
 [`¿Por qué creó Tanenbaum MINIX?`,`Porque la licencia de UNIX V7 prohibió enseñar su código y necesitaba un SO con código abierto para enseñar`,[`Para competir con Windows`,`Por encargo de IBM`,`Para servidores web`],`Publicó todo el código en su libro.`],
 [`¿A quién inspiró MINIX?`,`A Linus Torvalds para crear Linux`,[`A Bill Gates para crear Windows`,`A Steve Jobs`,`A Dijkstra`],`Torvalds usaba MINIX.`],
 [`¿Qué es un kernel monolítico?`,`Uno en el que todo el SO (drivers, FS, red) corre en modo kernel en un solo espacio`,[`Uno mínimo con drivers en modo usuario`,`Uno que corre en la nube`,`Uno sin drivers`],`Ejemplo: Linux.`],
 [`¿Qué es un microkernel?`,`Un kernel mínimo (IPC, planificación, memoria) con los drivers y servicios como procesos de usuario`,[`Un kernel para microondas`,`Un kernel monolítico chico`,`Un kernel sin planificación`],`Ejemplos: MINIX 3 y QNX.`],
 [`¿Cuál es la ventaja del microkernel?`,`Más confiabilidad y modularidad: si un driver falla, se reinicia sin tirar el sistema`,[`Más rendimiento`,`Menos código en total`,`No necesita IPC`],`Su costo es el rendimiento, por el pasaje de mensajes.`],
 [`¿Cuál es la desventaja del microkernel?`,`El rendimiento, por el costo del pasaje de mensajes`,[`Menos confiable`,`No es modular`,`No admite drivers`],`Es el trade-off clásico.`],
 [`¿Qué tipo de kernel usan Windows y macOS?`,`Híbrido`,[`Microkernel puro`,`Monolítico puro`,`No tienen kernel`],`Es un punto intermedio entre los dos.`],
 [`¿De qué trató el debate Tanenbaum–Torvalds de 1992?`,`Tanenbaum criticó que Linux fuera monolítico ("LINUX is obsolete") y poco portable`,[`Sobre qué lenguaje usar`,`Sobre el precio de Linux`,`Sobre el fin de UNIX`],`Torvalds defendió el rendimiento y la practicidad.`],
 [`"Daría la mitad del rendimiento a cambio de duplicar la confiabilidad." ¿Qué idea defiende?`,`Que hoy el hardware es rápido y lo caro son las fallas, así que la confiabilidad vale más`,[`Que el rendimiento es lo único que importa`,`Que hay que usar hardware viejo`,`Que los SO deben ser monolíticos`],`Ejemplo actual: el fallo de CrowdStrike de 2024.`],
 [`¿Qué pasó con CrowdStrike en julio de 2024?`,`Una actualización de un driver en modo kernel tiró millones de PCs con Windows`,[`Un virus borró Linux`,`Se cayó AWS`,`Se filtraron contraseñas de Google`],`Es un argumento a favor de la confiabilidad que plantea Tanenbaum.`],
 [`Según Tanenbaum, ¿los SO se vuelven más simples o más complejos?`,`Más complejos, porque cada hardware nuevo suma drivers, planificación y seguridad`,[`Más simples, porque el hardware es más rápido`,`Iguales`,`Desaparecen`],`SSD, GPU, NPU, coprocesadores criptográficos...`],
 [`¿Por qué ciertas ideas o algoritmos "vuelven" a ser relevantes?`,`Porque cambian los costos relativos del hardware (por ejemplo, el trade-off entre memoria y CPU)`,[`Por moda`,`Porque se olvidan`,`Porque lo exige la ley`],`Ejemplo: la planificación de disco pierde sentido con SSD.`],
 [`¿Qué recomienda Tanenbaum enseñar en las carreras de informática?`,`Principios y algoritmos duraderos, no herramientas específicas como Word o Excel`,[`Solo herramientas de oficina`,`Solo el último lenguaje de moda`,`Solo hardware`],`Las herramientas cambian; los conceptos perduran.`],
 [`¿Cuál de estas NO es una tendencia global del apunte?`,`Volver a instalar todo de forma local desde CD`,[`Nube híbrida`,`Zero Trust`,`IA aplicada al almacenamiento`],`Las otras sí son tendencias.`],
],

redir:[
 [`¿Qué hace ls > lista.txt si lista.txt ya existe?`,`Lo sobrescribe con la salida de ls`,[`Agrega la salida al final`,`Da error porque el archivo existe`,`Lo borra sin escribir nada`],`> siempre pisa el contenido; >> agrega.`],
 [`Ejecutás echo hola >> f.txt dos veces sobre un archivo vacío. ¿Qué queda en f.txt?`,`Dos líneas que dicen hola`,[`Una sola línea hola`,`Nada`,`La palabra holahola en una línea`],`>> agrega al final cada vez.`],
 [`¿Qué número de descriptor tiene stderr (la salida de errores)?`,`2`,[`0`,`1`,`3`],`0 = stdin, 1 = stdout, 2 = stderr.`],
 [`¿Qué número de descriptor tiene stdout (la salida normal)?`,`1`,[`0`,`2`,`3`],`Por eso 2>&1 significa "mandá el 2 adonde va el 1".`],
 [`Ejecutás ls /noexiste >> entrega.txt. ¿Dónde queda el mensaje de error?`,`En la pantalla: >> solo redirige stdout`,[`Dentro de entrega.txt`,`Se pierde sin mostrarse`,`En /var/log/errores`],`El error va por stderr (2), que no se redirigió. Con 2>&1 sí se guardaría.`],
 [`¿Cuál guarda en f.txt tanto la salida como los errores?`,`cmd >> f.txt 2>&1`,[`cmd >> f.txt`,`cmd 2> f.txt`,`cmd | f.txt`],`Primero se redirige stdout al archivo y después stderr al mismo lugar.`],
 [`¿Qué hace cmd 2> errores.txt?`,`Guarda solo los errores en errores.txt; la salida normal sigue en pantalla`,[`Guarda todo en errores.txt`,`Ejecuta el comando dos veces`,`Guarda la salida normal y descarta los errores`],`2> redirige solo el canal 2.`],
 [`¿Qué hace el | en ps aux | grep bash?`,`Pasa la salida de ps aux como entrada de grep`,[`Guarda ps aux en un archivo llamado grep`,`Ejecuta los dos comandos sin conectarlos`,`Ejecuta grep solo si ps falla`],`El pipe conecta stdout de un comando con stdin del siguiente.`],
 [`En cmd1 && cmd2, si cmd1 falla…`,`cmd2 no se ejecuta`,[`cmd2 se ejecuta igual`,`cmd2 se ejecuta dos veces`,`Se reintenta cmd1`],`&& = "y si salió bien, entonces...".`],
 [`¿Qué operador ejecuta cmd2 solo si cmd1 FALLA?`,`||`,[`&&`,`;`,`|`],`|| es el "o si no". ; ejecuta los dos siempre.`],
 [`¿Qué hace cmd1 ; cmd2?`,`Ejecuta los dos en orden, pase lo que pase`,[`Ejecuta cmd2 solo si cmd1 sale bien`,`Conecta la salida de uno con el otro`,`Comenta cmd2`],`; es solo un separador de comandos.`],
 [`¿Qué hace wc -l < palabras.txt?`,`Usa palabras.txt como entrada estándar y cuenta sus líneas`,[`Escribe el conteo dentro de palabras.txt`,`Borra palabras.txt`,`Da error, < no existe`],`< redirige stdin desde un archivo.`],
 [`¿Qué hace ps aux | grep bash | wc -l?`,`Cuenta cuántas líneas de procesos contienen bash`,[`Mata los procesos bash`,`Muestra los bash ordenados`,`Guarda los procesos en wc`],`Son tres comandos encadenados: listar, filtrar y contar.`],
 [`Si el archivo NO existe, ¿qué hacen > y >>?`,`Los dos lo crean`,[`Los dos dan error`,`> lo crea y >> da error`,`>> lo crea y > da error`],`La diferencia está en qué pasa cuando el archivo ya existe.`],
 [`¿Para qué sirve echo "=== Ejercicio 3 ===" >> entrega.txt en los TPs?`,`Para agregar un encabezado al final del archivo de entrega antes del resultado`,[`Para borrar el ejercicio 3`,`Para crear un archivo llamado Ejercicio 3`,`Para mostrar el ejercicio en pantalla sin guardarlo`],`Así el profe ve qué salida corresponde a cada ejercicio.`],
 [`Usaste > en vez de >> para guardar el ejercicio 20 en entrega.txt. ¿Qué pasó?`,`Se borraron los ejercicios 1 a 19 y quedó solo el 20`,[`Nada distinto`,`Se duplicó el contenido`,`Se guardó en otro archivo`],`Es el error más caro de los TPs.`],
 ['w',`Escribí el operador que AGREGA al final de un archivo`,[`>>`],`> sobrescribe; >> anexa.`],
 ['w',`Escribí lo que va al final para que los errores vayan al mismo destino que la salida`,[`2>&1`],`2 (stderr) → &1 (donde va stdout).`],
 ['w',`Guardá la salida de df -h al final de entrega.txt`,[`df -h >> entrega.txt`],`El patrón de todos los TPs: comando >> entrega.txt.`],
 ['w',`Guardá la salida de ls /etc al final de entrega.txt, incluidos los errores`,[`ls /etc >> entrega.txt 2>&1`,`ls /etc &>> entrega.txt`],`El orden es >> primero y 2>&1 después.`],
],
nav:[
 [`¿Qué hace ls -la?`,`Lista todo, incluidos los ocultos, en formato largo`,[`Lista solo los directorios`,`Borra los ocultos`,`Lista ordenando por tamaño`],`l = long, a = all.`],
 [`¿Qué agrega la h en ls -lh?`,`Tamaños legibles: K, M, G`,[`Muestra la ayuda`,`Oculta archivos`,`Ordena por hora`],`h = human readable. Pasa lo mismo en df -h, du -h y free -h.`],
 [`¿Cómo ordena ls -lt?`,`Por fecha de modificación, el más reciente primero`,[`Alfabéticamente`,`Por tamaño`,`Por tipo`],`t = time.`],
 [`¿Cómo ordena ls -ltr?`,`Por fecha, el más VIEJO primero`,[`Por fecha, el más nuevo primero`,`Por tamaño invertido`,`De forma recursiva`],`r invierte el orden de -t.`],
 [`¿Qué flag de ls ordena por tamaño?`,`-S`,[`-s`,`-t`,`-h`],`S mayúscula = Size.`],
 [`¿Para qué sirve ls -ld ~?`,`Para ver los permisos del directorio home en sí, no su contenido`,[`Para listar el home de forma recursiva`,`Para listar los enlaces`,`Para borrar el home`],`d = directory. Se usa para verificar chmod 700 ~.`],
 [`¿Qué muestra pwd?`,`La ruta absoluta del directorio en el que estás`,[`La contraseña`,`Los procesos`,`El directorio padre`],`Print Working Directory.`],
 [`¿Adónde lleva cd ..?`,`Al directorio padre (un nivel arriba)`,[`Al home`,`A la raíz`,`Al directorio anterior`],`.. = padre, . = actual.`],
 [`¿Adónde lleva cd - ?`,`Al directorio en el que estabas antes`,[`Al home`,`Un nivel arriba`,`A la raíz`],`Es como el botón "atrás".`],
 [`¿Cuál de estas es una ruta ABSOLUTA?`,`/home/lucas/notas.txt`,[`notas.txt`,`../notas.txt`,`lab/notas.txt`],`Las absolutas empiezan con / (la raíz).`],
 [`¿Qué tienen en común .bashrc y .profile?`,`Son ocultos porque empiezan con punto`,[`Son directorios`,`Son ejecutables`,`Son del sistema y no se pueden leer`],`ls no los muestra; ls -a sí.`],
 [`¿Qué pasa con mkdir lab/modulo1 si lab no existe?`,`Da error: No such file or directory`,[`Crea las dos carpetas`,`Crea solo modulo1`,`Crea un archivo`],`Para crear toda la cadena hace falta -p.`],
 [`¿Qué hace mkdir -p lab/mod1/evid?`,`Crea toda la estructura de una vez, sin error si ya existe`,[`Crea solo evid`,`Crea las carpetas con permisos públicos`,`Muestra el path`],`-p = parents.`],
 [`rmdir practica_so funciona solo si…`,`La carpeta está vacía`,[`La carpeta tiene archivos`,`Sos root`,`La carpeta está oculta`],`Con contenido se usa rm -r.`],
 [`¿Cómo se borra una carpeta con todo su contenido?`,`rm -r carpeta`,[`rmdir carpeta`,`rm carpeta`,`del carpeta`],`-r = recursivo. No hay papelera.`],
 [`¿Qué pasa con cp lab lab_backup si lab es una carpeta?`,`Da error: cp no copia carpetas sin -r`,[`Copia la carpeta`,`Mueve la carpeta`,`Crea un enlace`],`El mensaje es "-r not specified; omitting directory".`],
 [`¿Qué hace mv borrador.txt notas.txt?`,`Renombra borrador.txt a notas.txt`,[`Copia el archivo`,`Borra notas.txt`,`Crea un enlace`],`mv mueve y renombra.`],
 [`¿Qué hace mv notas.txt lab_seguridad/?`,`Mueve notas.txt dentro de lab_seguridad`,[`Renombra la carpeta`,`Copia notas.txt`,`Da error`],`Si el destino es una carpeta, mueve el archivo adentro.`],
 [`¿Qué hace touch f.txt si f.txt ya existe?`,`Actualiza su fecha de modificación sin cambiar el contenido`,[`Lo vacía`,`Da error`,`Lo duplica`],`Si no existe, lo crea vacío.`],
 [`En "-rw-r--r-- 1 lucas lucas 30 oct 26 21:00 notas.txt", ¿qué es 30?`,`El tamaño en bytes`,[`La cantidad de enlaces`,`El UID`,`Los permisos en octal`],`El orden es: tipo y permisos, enlaces, dueño, grupo, tamaño, fecha y nombre.`,`$ ls -l notas.txt\n-rw-r--r-- 1 lucas lucas 30 oct 26 21:00 notas.txt`],
 [`En la misma línea, ¿qué son los dos "lucas"?`,`El dueño y el grupo`,[`El usuario y la contraseña`,`El host y el usuario`,`El creador y el último que lo modificó`],`Tercer campo = dueño, cuarto = grupo.`,`$ ls -l notas.txt\n-rw-r--r-- 1 lucas lucas 30 oct 26 21:00 notas.txt`],
 [`¿Qué indica el primer carácter "d" en drwx------?`,`Que es un directorio`,[`Que está borrado`,`Que es un disco`,`Que es un demonio`],`- archivo, d directorio, l enlace simbólico.`],
 ['w',`Creá en un solo paso la estructura lab_seguridad/modulo1/evidencias`,[`mkdir -p lab_seguridad/modulo1/evidencias`],`-p crea toda la cadena.`],
 ['w',`Copiá la carpeta lab_seguridad (con todo) a lab_seguridad_backup`,[`cp -r lab_seguridad lab_seguridad_backup`,`cp -R lab_seguridad lab_seguridad_backup`],`Sin -r, cp no copia carpetas.`],
 ['w',`Listá todo tu home, incluidos los ocultos, en formato largo`,[`ls -la ~`,`ls -la`,`ls -la /home/lucas`],`-l largo, -a ocultos.`],
 ['w',`Renombrá borrador.txt a notas.txt`,[`mv borrador.txt notas.txt`],`mv renombra.`],
 ['w',`Mostrá la ruta en la que estás`,[`pwd`],`Print Working Directory.`],
],
buscar:[
 [`¿Qué comando busca ARCHIVOS por nombre?`,`find`,[`grep`,`locate -c`,`cat`],`find = archivos por nombre o atributos.`],
 [`¿Qué comando busca TEXTO dentro de los archivos?`,`grep`,[`find`,`ls`,`cut`],`grep = líneas que contienen un patrón.`],
 [`¿Qué hace find ~ -name "*.txt"?`,`Busca de forma recursiva en el home los archivos terminados en .txt`,[`Busca la palabra txt dentro de los archivos`,`Lista solo la carpeta actual`,`Borra los .txt`],`* significa "cualquier cosa".`],
 [`¿Qué diferencia hay entre -name e -iname en find?`,`-iname ignora mayúsculas y minúsculas`,[`-iname busca dentro del contenido`,`-iname busca por inodo`,`No hay diferencia`],`Notas.TXT coincide con -iname "*.txt".`],
 [`¿Qué hace find . -type d?`,`Lista solo los directorios`,[`Lista los archivos borrados`,`Busca por fecha`,`Busca discos`],`-type f = archivos, -type d = directorios.`],
 [`¿Qué hace find ~ -size +10M?`,`Busca archivos de más de 10 MB`,[`Busca 10 archivos`,`Busca archivos de menos de 10 MB`,`Muestra el espacio libre`],`+ = más que, - = menos que.`],
 [`¿Por qué se pone "*.txt" entre comillas en find?`,`Para que el * lo interprete find y no la shell`,[`Porque es obligatorio en todos los comandos`,`Para buscar el texto literal "*.txt"`,`Para que sea más rápido`],`Sin comillas, la shell podría reemplazar el * por los archivos de la carpeta actual.`],
 [`¿Qué hace grep -i "root" /etc/passwd?`,`Busca root ignorando mayúsculas y minúsculas`,[`Invierte la búsqueda`,`Cuenta las coincidencias`,`Busca de forma recursiva`],`i = ignore case.`],
 [`¿Qué hace grep -v "/bin/bash" /etc/passwd?`,`Muestra las líneas que NO contienen /bin/bash`,[`Muestra las que sí lo contienen`,`Muestra la versión de bash`,`Activa el modo verbose`],`v = invert. En grep no es "verbose".`],
 [`¿Qué hace grep -c?`,`Cuenta cuántas LÍNEAS coinciden`,[`Cuenta cuántas veces aparece la palabra en total`,`Colorea la salida`,`Copia las líneas`],`Si la palabra aparece dos veces en una línea, cuenta 1.`],

const ALGS=[{id:'FCFS',n:'FCFS'},{id:'SJF',n:'SJF (no expropiativo)'},{id:'SRTF',n:'SRTF (expropiativo)'},{id:'RR',n:'Round Robin, q = 2'},{id:'PE',n:'Prioridad expropiativa'},{id:'PN',n:'Prioridad no expropiativa'}];
function simSched(ps,alg){const n=ps.length, rem=ps.map(p=>p.c), tl=[]; let t=0, done=0;
  if(alg==='RR'){const q=2, queue=[], arr=new Set(); const arrive=()=>ps.forEach((p,i)=>{if(!arr.has(i)&&p.a<=t){queue.push(i);arr.add(i);}}); arrive();
